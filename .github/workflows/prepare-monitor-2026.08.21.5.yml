name: Prepare monitor 2026.08.21.5

on:
  push:
    branches:
      - work/2026.08.21.5

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Flatten and harden monitor source
        run: |
          python3 tools/prepare_monitor_2026_08_21_5.py
          rm -f tools/prepare_monitor_2026_08_21_5.py

      - name: Compile monitor with warnings as errors
        run: |
          gcc -O2 -static -Wall -Wextra -Werror \
            -DDAP_VERSION='"2026.08.21.5"' \
            -o /tmp/disk_wake_monitor \
            source/usr/local/emhttp/plugins/disk.activity/src/disk_wake_monitor.c
          /tmp/disk_wake_monitor --version
          /tmp/disk_wake_monitor --help

      - name: Commit generated single-file source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/usr/local/emhttp/plugins/disk.activity/src tools/prepare_monitor_2026_08_21_5.py
          git commit -m 'Refactor monitor into hardened single C source'
          git push
