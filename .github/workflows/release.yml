name: Publish Release
on:
  create:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.ref_type == 'branch' && startsWith(github.ref_name, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin package
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libc6-dev xz-utils
          VERSION="${GITHUB_REF_NAME#release/}"
          ./build.sh "$VERSION"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#release/}"
          TAG="v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" \
            "build/disk.activity-${VERSION}.txz" \
            "build/disk.activity-${VERSION}.md5" \
            "build/disk.activity-${VERSION}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Disk Activity Plus ${VERSION}" \
            --notes-file RELEASE_NOTES.md
